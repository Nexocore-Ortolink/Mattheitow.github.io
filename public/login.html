<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - OrtoLink</title>
    <meta name="description" content="Inicia sesión en tu cuenta de OrtoLink para continuar con tu proceso de rehabilitación o monitoreo clínico.">
    <meta name="author" content="Nexocore">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="assets/styles/styles.css?v=1.0.1">
</head>

<body class="login-page-body">
    <div class="login-page-container">
        <main class="login-card">
            <a href="index.html" class="btn-login-back" aria-label="Volver a la página principal">
                <span class="material-symbols-rounded">arrow_back</span>
                <span>Volver al inicio</span>
            </a>
            <div class="login-card-header">
                <img src="assets/images/Ortolink logo sin fondo.png" alt="OrtoLink Logo" class="login-logo">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa tus credenciales para acceder a la plataforma</p>
            </div>
            <div class="role-selector login-role">
                <button class="btn-role-login active" id="btnLoginRolePatient" type="button">Soy Paciente</button>
                <button class="btn-role-login" id="btnLoginRoleSpecialist" type="button">Soy Especialista</button>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                <p class="form-notice" id="loginNotice"></p>
            </form>
            <div class="login-card-footer">
                <p>¿No tienes una cuenta? <a href="index.html#registro" id="linkToRegister">Regístrate aquí</a></p>
            </div>
        </main>
    </div>
    <script src="assets/scripts/login.js"></script>
</body>

</html>
